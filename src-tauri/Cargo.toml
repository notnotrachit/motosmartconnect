[package]
name = "smartconnect-mac"
version = "0.1.0"
description = "Unofficial Smart Connect host for macOS"
authors = ["you"]
edition = "2024"

[lib]
name = "smartconnect_mac_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
rcgen = { version = "0.13", features = ["pem", "ring"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
uuid = { version = "1", features = ["v5"] }
aes-gcm = "0.10"
subtle = "2"
qrcode = "0.14"
mdns-sd = "0.13"
tokio-tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
local-ip-address = "0.6"
dirs = "6"
anyhow = "1"
time = "0.3"
hostname = "0.4"
hex = "0.4"
futures-util = "0.3"
webrtc = "=0.11.0"
webrtc-ice = "=0.11.0"
openh264 = "0.6"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
bytes = "1"

# The dev app is what plays the phone screen. Debug-mode JPEG and color conversion
# were slower than the frames, so the picture stayed behind the phone.
[profile.dev.package.smartconnect-mac]
opt-level = 2

[profile.dev.package.image]
opt-level = 3

[profile.dev.package.openh264]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone app</title>
    <script>
      try {
        var prefs = (JSON.parse(localStorage.getItem("smartconnect.ui") || "{}").state || {}).prefs || {};
        document.documentElement.dataset.accent = prefs.accent || "green";
      } catch (e) {}
    </script>
  </head>
  <body style="background: #000">
    <div id="root"></div>
    <script type="module" src="/src/stream/main.tsx"></script>
  </body>
</html>
